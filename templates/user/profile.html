<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
<head><title>My Profile</title></head>
<body>
<section>
    <style>
        .profile-page{background:#f4f9f8;min-height:90vh;padding:2.5rem 0;}
        .profile-card{background:#fff;border-radius:20px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.06);}
        .profile-header{background:linear-gradient(135deg,#00796b,#009688);padding:2.5rem 2rem;text-align:center;color:#fff;}
        .p-avatar{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;font-family:'Playfair Display',serif;border:3px solid rgba(255,255,255,.4);margin:0 auto 1rem;}
        .profile-header h2{font-family:'Playfair Display',serif;font-size:1.7rem;margin-bottom:.25rem;}
        .profile-header p{color:rgba(255,255,255,.8);font-size:.9rem;margin:0;}
        .profile-body{padding:2rem;}
        .detail-row{display:flex;align-items:center;gap:1rem;padding:.85rem 0;border-bottom:1px solid #f1f5f9;}
        .detail-row:last-child{border-bottom:none;}
        .detail-icon{width:38px;height:38px;border-radius:10px;background:#e0f2f1;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
        .detail-lbl{font-size:.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.15rem;}
        .detail-val{font-size:.95rem;color:#1a2332;}
        .role-badge{display:inline-block;background:#e0f2f1;color:#009688;font-size:.78rem;font-weight:600;padding:.25rem .75rem;border-radius:20px;}
    </style>

    <div class="profile-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="p-avatar" th:text="${#strings.substring(user.name,0,1).toUpperCase()}">V</div>
                            <h2 th:text="${user.name}">Name</h2>
                            <p th:text="${user.email}">email@example.com</p>
                        </div>
                        <div class="profile-body">
                            <div class="detail-row">
                                <div class="detail-icon">👤</div>
                                <div><div class="detail-lbl">Full Name</div><div class="detail-val" th:text="${user.name}">-</div></div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-icon">✉️</div>
                                <div><div class="detail-lbl">Email</div><div class="detail-val" th:text="${user.email}">-</div></div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-icon">📞</div>
                                <div><div class="detail-lbl">Phone</div><div class="detail-val" th:text="${user.phone ?: 'Not provided'}">-</div></div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-icon">📝</div>
                                <div><div class="detail-lbl">About</div><div class="detail-val" th:text="${user.about ?: 'Not provided'}">-</div></div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-icon">🔐</div>
                                <div><div class="detail-lbl">Role</div><div class="detail-val"><span class="role-badge" th:text="${user.role}">ROLE_USER</span></div></div>
                            </div>
                            <div style="margin-top:1.5rem;display:flex;gap:.75rem">
                                <a th:href="@{/user/dashboard}" style="background:#009688;color:#fff;padding:.7rem 1.5rem;border-radius:10px;text-decoration:none;font-weight:500;font-size:.9rem">← Dashboard</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>

<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title != null} ? ${title} : 'Smart Contact Manager'">Smart Contact Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }

        /* ── NAVBAR ── */
        .navbar {
            background: #00796b !important;
            padding: .85rem 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,.18);
        }
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.22rem;
            font-weight: 700;
            letter-spacing: .02em;
            color: #fff !important;
            display: flex;
            align-items: center;
            gap: .45rem;
            text-decoration: none;
        }
        .navbar-brand::before { content: '📇'; font-size: 1.05rem; }

        .nav-link {
            font-size: .875rem;
            font-weight: 500;
            color: rgba(255,255,255,.85) !important;
            padding: .4rem .85rem !important;
            border-radius: 8px;
            transition: background .2s, color .2s;
            letter-spacing: .025em;
        }
        .nav-link:hover,
        .nav-link.active {
            background: rgba(255,255,255,.15);
            color: #fff !important;
        }

        /* Auth buttons */
        .btn-nav-login {
            font-size: .84rem; font-weight: 500;
            padding: .4rem 1.05rem; border-radius: 8px;
            background: rgba(255,255,255,.14);
            border: 1.5px solid rgba(255,255,255,.35);
            color: #fff !important;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-nav-login:hover { background: rgba(255,255,255,.25); color: #fff !important; }

        .btn-nav-signup {
            font-size: .84rem; font-weight: 600;
            padding: .4rem 1.05rem; border-radius: 8px;
            background: #fff; border: none;
            color: #00796b !important;
            text-decoration: none;
            transition: background .2s, transform .15s;
        }
        .btn-nav-signup:hover { background: #e0f2f1; transform: translateY(-1px); color: #00796b !important; }

        /* User badge (logged in) */
        .user-badge {
            display: flex; align-items: center; gap: .5rem;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 20px;
            padding: .28rem .85rem .28rem .42rem;
            color: #fff; font-size: .84rem;
        }
        .user-badge .u-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(255,255,255,.28);
            display: flex; align-items: center; justify-content: center;
            font-size: .7rem; font-weight: 700; color: #00796b;
        }

        /* Logout button */
        .btn-logout {
            background: none; border: none;
            color: rgba(255,255,255,.82); font-family: 'DM Sans', sans-serif;
            font-size: .84rem; font-weight: 500; cursor: pointer;
            padding: .4rem .85rem; border-radius: 8px;
            transition: background .2s, color .2s;
        }
        .btn-logout:hover { background: rgba(255,255,255,.15); color: #fff; }

        /* Flash message bar (global) */
        .global-flash {
            padding: .7rem 1.5rem;
            font-size: .875rem;
            display: flex; align-items: center; gap: .5rem;
            border-left: 4px solid;
        }
        .global-flash.flash-danger  { background: #fdecea; border-color: #e53935; color: #b71c1c; }
        .global-flash.flash-warning { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
        .global-flash.flash-success { background: #f0fdf4; border-color: #22c55e; color: #14532d; }
    </style>
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">Smart Contact Manager</a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">

            <!-- Left links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a th:href="@{/home}" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/about}" class="nav-link">About</a>
                </li>
                <!-- Only visible when logged in -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a th:href="@{/user/dashboard}" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a th:href="@{/user/add-contact}" class="nav-link">Add Contact</a>
                </li>
            </ul>

            <!-- Right actions -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-2">

                <!-- NOT authenticated -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn-nav-login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/signup}" class="btn-nav-signup">Sign Up</a>
                </li>

                <!-- Authenticated: show username badge + logout -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <div class="user-badge">
                        <div class="u-avatar">
                            <!-- First letter of the logged-in username -->
                            <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                        </div>
                        <!-- Show full email / username -->
                        <span sec:authentication="name">User</span>
                    </div>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!--
                      Logout MUST be POST (Spring Security default).
                      th:action injects CSRF automatically — no manual _csrf input needed.
                    -->
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <button type="submit" class="btn-logout">Logout</button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- ── GLOBAL FLASH MESSAGE (shown on any page using this layout) ── -->
<div th:if="${session.message != null}"
     th:class="${session.message.type == 'alert-danger'}  ? 'global-flash flash-danger'  :
               (session.message.type == 'alert-warning' ? 'global-flash flash-warning' :
                                                          'global-flash flash-success')">
    <span th:text="${session.message.content}">Message</span>
</div>

<!-- ── PAGE CONTENT (injected by child templates) ── -->
<div th:replace="${content}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
